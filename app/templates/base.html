<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Image Matching Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }

        /* ============================================================
               SIDEBAR - PREMIUM GLASS DARK THEME
               ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 280px;
            background: linear-gradient(165deg, #0b1120 0%, #1a2332 45%, #1e293b 100%);
            backdrop-filter: blur(20px);
            padding: 0;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 8px 0 40px rgba(0, 0, 0, 0.25);
        }

        .sidebar::-webkit-scrollbar {
            width: 3px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 10px;
        }

        /* -- Brand Area -- */
        .sidebar-brand {
            padding: 30px 28px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }

        .sidebar-brand .logo-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-brand .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .sidebar-brand .logo-icon:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5);
        }

        .sidebar-brand .logo-icon .glow {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            background: #34d399;
            border-radius: 50%;
            border: 2.5px solid #0b1120;
            animation: pulse-dot 2.2s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .sidebar-brand .brand-text h4 {
            font-weight: 800;
            font-size: 21px;
            color: #ffffff;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.4px;
        }

        .sidebar-brand .brand-text h4 span {
            background: linear-gradient(135deg, #818cf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-brand .brand-text small {
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        /* -- Navigation -- */
        .sidebar .nav {
            padding: 18px 16px 24px;
        }

        .sidebar .nav-label {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1.6px;
            padding: 18px 16px 8px;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.45);
            padding: 11px 18px;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 2px 0;
            text-decoration: none;
            position: relative;
            border: 1px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .sidebar .nav-link.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.18), rgba(139, 92, 246, 0.06));
            border-color: rgba(99, 102, 241, 0.12);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.06);
            transform: translateX(0);
        }

        .sidebar .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 60%;
            width: 3.5px;
            background: linear-gradient(180deg, #6366f1, #a855f7);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 0 24px rgba(99, 102, 241, 0.35);
        }

        .sidebar .nav-link i {
            font-size: 19px;
            width: 24px;
            text-align: center;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .sidebar .nav-link.active i {
            opacity: 1;
        }

        .sidebar .nav-link .badge-count {
            margin-left: auto;
            background: rgba(99, 102, 241, 0.18);
            color: #a5b4fc;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .sidebar .nav-link.active .badge-count {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .sidebar .nav-link:hover .badge-count {
            background: rgba(99, 102, 241, 0.3);
            color: #ffffff;
        }

        /* ============================================================
               MAIN CONTENT
               ============================================================ */
        .main-content {
            margin-left: 280px;
            padding: 32px 44px 44px;
            min-height: 100vh;
            background: #f8fafc;
        }

        /* ============================================================
               TOP BAR
               ============================================================ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 34px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .top-bar .page-title h1 {
            font-size: 30px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.6px;
            margin: 0;
            line-height: 1.2;
        }

        .top-bar .page-title h1 .highlight {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .top-bar .page-title p {
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
            margin: 4px 0 0;
        }

        .top-bar .date-badge {
            background: #ffffff;
            padding: 10px 26px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .top-bar .date-badge i {
            color: #6366f1;
            font-size: 16px;
        }

        /* ============================================================
               STAT CARDS
               ============================================================ */
        .stat-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 26px 30px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            border-color: rgba(99, 102, 241, 0.08);
        }

        .stat-card .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-card .stat-number {
            font-size: 38px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.8px;
            line-height: 1.1;
        }

        .stat-card .stat-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .stat-card .stat-icon {
            font-size: 36px;
            opacity: 0.06;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .stat-card:hover .stat-icon {
            opacity: 0.1;
            transform: scale(1.05) rotate(-3deg);
        }

        .stat-card .stat-trend {
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 16px;
            border-radius: 30px;
        }

        .stat-card .stat-trend.up {
            color: #059669;
            background: #d1fae5;
        }

        .stat-card .stat-trend.down {
            color: #dc2626;
            background: #fecaca;
        }

        .stat-card .stat-trend.neutral {
            color: #6366f1;
            background: #e0e7ff;
        }

        .stat-card .stat-trend i {
            font-size: 12px;
        }

        /* ============================================================
               CARDS
               ============================================================ */
        .card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 22px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.4s ease;
            height: 100%;
        }

        .card:hover {
            box-shadow: 0 8px 44px rgba(0, 0, 0, 0.04);
        }

        .card-header {
            background: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            padding: 22px 28px;
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header i {
            color: #6366f1;
            font-size: 18px;
        }

        .card-header .card-actions {
            margin-left: auto;
        }

        .card-body {
            padding: 26px 28px;
        }

        /* ============================================================
               STATUS BOXES
               ============================================================ */
        .status-box {
            padding: 20px 24px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            background: #f8fafc;
            height: 100%;
        }

        .status-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
            background: #ffffff;
            border-color: rgba(0, 0, 0, 0.04);
        }

        .status-box .number {
            font-size: 30px;
            font-weight: 700;
            color: #0f172a;
        }

        .status-box .label {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            margin-top: 2px;
        }

        /* ============================================================
               ACTIVITY ITEMS
               ============================================================ */
        .activity-item {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
            border-radius: 12px;
            margin: 0 -4px;
        }

        .activity-item:hover {
            background: rgba(0, 0, 0, 0.01);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item .activity-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .activity-item .activity-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .activity-item .activity-icon.upload {
            background: #e0f2fe;
            color: #0284c7;
        }
        .activity-item .activity-icon.approved {
            background: #d1fae5;
            color: #059669;
        }
        .activity-item .activity-icon.rejected {
            background: #fecaca;
            color: #dc2626;
        }
        .activity-item .activity-icon.review {
            background: #fef3c7;
            color: #d97706;
        }
        .activity-item .activity-icon.image {
            background: #ede9fe;
            color: #7c3aed;
        }

        .activity-item .activity-text {
            flex: 1;
            min-width: 0;
        }

        .activity-item .activity-text strong {
            color: #0f172a;
            font-weight: 600;
            display: block;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity-item .activity-text small {
            color: #94a3b8;
            font-size: 12px;
            display: block;
            margin-top: 1px;
        }

        .activity-item .activity-time {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
            flex-shrink: 0;
            margin-left: 12px;
        }

        /* ============================================================
               PROGRESS BAR
               ============================================================ */
        .progress-custom {
            height: 8px;
            border-radius: 12px;
            background: #f1f5f9;
            overflow: hidden;
            margin-top: 18px;
        }

        .progress-custom .progress-bar {
            height: 100%;
            border-radius: 12px;
            transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #6366f1, #a855f7);
        }

        /* ============================================================
               RESPONSIVE
               ============================================================ */
        @media (max-width: 992px) {
            .sidebar {
                width: 0;
                overflow: hidden;
                box-shadow: none;
                border-right: none;
            }

            .main-content {
                margin-left: 0;
                padding: 24px 20px 30px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .top-bar .date-badge {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 576px) {
            .stat-card .stat-number {
                font-size: 28px;
            }

            .main-content {
                padding: 16px 14px 24px;
            }

            .card-body {
                padding: 18px 16px;
            }

            .card-header {
                padding: 18px 16px;
            }

            .stat-card {
                padding: 18px 20px;
            }

            .top-bar .page-title h1 {
                font-size: 24px;
            }

            .activity-item {
                flex-wrap: wrap;
                gap: 6px;
            }

            .activity-item .activity-time {
                margin-left: 56px;
            }
        }

        /* ============================================================
               UTILITY HELPERS
               ============================================================ */
        .text-gradient {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bg-soft-primary {
            background: #eef2ff;
        }

        .border-soft {
            border-color: rgba(0, 0, 0, 0.04) !important;
        }

        .gap-2 {
            gap: 0.5rem;
        }
        .gap-3 {
            gap: 1rem;
        }
        .gap-4 {
            gap: 1.5rem;
        }

        /* ============================================================
               SCROLLBAR FOR MAIN CONTENT
               ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- ============================================================
    SIDEBAR
    ============================================================ -->
    <nav class="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-brand">
            <div class="logo-wrapper">
                <div class="logo-icon" aria-hidden="true">
                    AI
                    <span class="glow"></span>
                </div>
            </div>
            <div class="brand-text">
                <h4>Image<span>Match</span></h4>
                <small>AI Image Understanding</small>
            </div>
        </div>

        <ul class="nav flex-column">
            <li class="nav-label">Main</li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/dashboard">
                    <i class="bi bi-speedometer2" aria-hidden="true"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'images' %}active{% endif %}" href="/dashboard/images">
                    <i class="bi bi-image" aria-hidden="true"></i>
                    <span>Images</span>
                    <span class="badge-count" id="sidebar-images">0</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'blogs' %}active{% endif %}" href="/dashboard/blogs">
                    <i class="bi bi-file-text" aria-hidden="true"></i>
                    <span>Blog Posts</span>
                    <span class="badge-count" id="sidebar-posts">0</span>
                </a>
            </li>

            <li class="nav-label">AI &amp; Reviews</li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'suggestions' %}active{% endif %}" href="/dashboard/suggestions">
                    <i class="bi bi-lightbulb" aria-hidden="true"></i>
                    <span>Suggestions</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'reviews' %}active{% endif %}" href="/dashboard/reviews">
                    <i class="bi bi-check2-circle" aria-hidden="true"></i>
                    <span>Reviews</span>
                    <span class="badge-count" id="sidebar-pending">0</span>
                </a>
            </li>

            <li class="nav-label">Analytics</li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'costs' %}active{% endif %}" href="/dashboard/costs">
                    <i class="bi bi-coin" aria-hidden="true"></i>
                    <span>Cost Logs</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'evaluation' %}active{% endif %}" href="/dashboard/evaluation">
                    <i class="bi bi-graph-up" aria-hidden="true"></i>
                    <span>Evaluation</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
