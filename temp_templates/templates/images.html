{% extends "base.html" %}

{% block title %}Images - AI Image Matching{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📸 Images</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
        <i class="bi bi-upload"></i> Upload Image
    </button>
</div>

<!-- Upload Modal -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Upload Image</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label class="form-label">Select Image</label>
                        <input type="file" class="form-control" id="imageFile" accept="image/*" required>
                    </div>
                    <div id="uploadStatus" style="display:none;" class="alert alert-info">Uploading...</div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitUpload()">Upload</button>
            </div>
        </div>
    </div>
</div>

<div id="images-container">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>

<script>
async function loadImages() {
    try {
        const response = await fetch('/api/images/');
        if (!response.ok) throw new Error('Failed to fetch images');
        const images = await response.json();
        const container = document.getElementById('images-container');
        
        if (!images || images.length === 0) {
            container.innerHTML = '<div class="text-center py-5"><i class="bi bi-image" style="font-size: 4rem; color: #ddd;"></i><p class="text-muted mt-3">No images uploaded yet</p></div>';
            return;
        }
        
        let html = '<div class="row">';
        images.forEach(img => {
            let statusColor = 'warning';
            if (img.processing_status === 'completed') statusColor = 'success';
            else if (img.processing_status === 'failed') statusColor = 'danger';
            
            html += '<div class="col-md-3 col-sm-6 mb-4">';
            html += '<div class="card h-100">';
            html += '<div class="card-body">';
            html += '<h6 class="card-title text-truncate" title="' + img.filename + '">' + img.filename + '</h6>';
            html += '<p class="small text-muted mb-1">ID: ' + img.id + '</p>';
            html += '<p class="small text-muted mb-1">Size: ' + (img.file_size/1024).toFixed(1) + ' KB</p>';
            html += '<span class="badge bg-' + statusColor + '">' + img.processing_status + '</span>';
            if (img.has_metadata) html += '<span class="badge bg-info ms-1">metadata</span>';
            if (img.has_embedding) html += '<span class="badge bg-secondary ms-1">embedding</span>';
            html += '</div>';
            html += '<div class="card-footer bg-transparent">';
            html += '<button class="btn btn-sm btn-outline-danger" onclick="deleteImage(' + img.id + ')"><i class="bi bi-trash"></i></button>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
        
    } catch (e) {
        console.error('Error loading images:', e);
        document.getElementById('images-container').innerHTML = '<div class="alert alert-danger">Error loading images: ' + e.message + '</div>';
    }
}

async function submitUpload() {
    const fileInput = document.getElementById('imageFile');
    if (!fileInput.files[0]) {
        alert('Please select an image');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    
    const status = document.getElementById('uploadStatus');
    status.style.display = 'block';
    status.textContent = 'Uploading...';
    
    try {
        const response = await fetch('/api/images/upload', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        status.style.display = 'none';
        
        if (response.ok) {
            alert('Image uploaded successfully!');
            document.getElementById('uploadModal').querySelector('.btn-close').click();
            loadImages();
        } else {
            alert('Upload failed: ' + JSON.stringify(data));
        }
    } catch (e) {
        status.style.display = 'none';
        alert('Upload failed: ' + e.message);
    }
}

async function deleteImage(id) {
    if (!confirm('Delete this image?')) return;
    try {
        const response = await fetch('/api/images/' + id, { method: 'DELETE' });
        if (response.ok) {
            alert('Image deleted!');
            loadImages();
        } else {
            alert('Delete failed');
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

// Load images when page loads
document.addEventListener('DOMContentLoaded', loadImages);
</script>
{% endblock %}
