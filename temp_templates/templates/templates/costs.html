{% extends "base.html" %}

{% block title %}Cost Logs - AI Image Matching{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>💰 Cost Logs</h2>
    <span class="badge bg-success">Using Ollama (Free)</span>
</div>

<div class="alert alert-info">
    <i class="bi bi-info-circle"></i> You are using <strong>Ollama</strong> locally. All AI processing is <strong>FREE</strong> with no API costs!
</div>

<div id="costs-container">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadCosts() {
    try {
        const response = await fetch('/api/usage/logs');
        const data = await response.json();
        const container = document.getElementById('costs-container');
        const logs = data.logs || [];
        
        if (logs.length === 0) {
            container.innerHTML = '<div class="text-center py-5"><i class="bi bi-coin" style="font-size: 4rem; color: #ddd;"></i><p class="text-muted mt-3">No usage logs yet</p></div>';
            return;
        }
        
        let html = '<div class="table-responsive"><table class="table table-hover"><thead><tr>';
        html += '<th>ID</th><th>Service</th><th>Model</th><th>Status</th><th>Time (ms)</th><th>Savings</th><th>Created</th>';
        html += '</tr></thead><tbody>';
        
        for (let log of logs) {
            let statusColor = log.status === 'success' ? 'success' : 'danger';
            html += '<tr>';
            html += '<td>' + log.id + '</td>';
            html += '<td><span class="badge bg-info">' + log.service + '</span></td>';
            html += '<td>' + log.model + '</td>';
            html += '<td><span class="badge bg-' + statusColor + '">' + log.status + '</span></td>';
            html += '<td>' + (log.response_time_ms || '-') + '</td>';
            html += '<td>$' + (log.cost_savings_usd ? log.cost_savings_usd.toFixed(6) : '0') + '</td>';
            html += '<td>' + new Date(log.created_at).toLocaleString() + '</td>';
            html += '</tr>';
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;
        
    } catch (e) {
        console.error('Error loading costs:', e);
        document.getElementById('costs-container').innerHTML = '<div class="alert alert-danger">Error loading cost logs</div>';
    }
}
loadCosts();
</script>
{% endblock %}
